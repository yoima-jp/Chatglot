name: Bug report
description: Report a reproducible problem in Chatglot
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.
        Please fill in as much detail as you can so we can reproduce the problem quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to trigger the issue.
      placeholder: |
        1. Open ...
        2. Change ...
        3. Click ...
        4. Crash or wrong behavior happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What actually happened?
    validations:
      required: true
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: chatglot_version
    attributes:
      label: Chatglot version
      placeholder: "26.03.29-mc26.1"
    validations:
      required: true
  - type: dropdown
    id: launcher
    attributes:
      label: Launcher
      options:
        - PrismLauncher
        - MultiMC
        - Modrinth App
        - Official Launcher
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Active provider
      options:
        - default
        - gas
        - deepl
        - google
        - codex
        - openai
        - gemini
        - anthropic
        - azure
        - translategemma_local
        - not sure
    validations:
      required: true
  - type: dropdown
    id: shared_appdata
    attributes:
      label: AppData shared settings
      options:
        - "On"
        - "Off"
        - not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, crash report, or screenshots
      description: Paste the relevant part of the log or drag screenshots here.
      placeholder: Paste logs here.
      render: shell
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      placeholder: Anything else that may help.
    validations:
      required: false
