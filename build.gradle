plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.12' apply false
}

def buildDate = java.time.LocalDate.now(java.time.ZoneId.of("Asia/Tokyo"))
    .format(java.time.format.DateTimeFormatter.ofPattern("yy.MM.dd"))
def computedModVersion = "${buildDate}-mc${minecraft_version}"
rootProject.ext.set("mod_version", computedModVersion)

def modDeckJar = file("${rootDir}/.gradle/mod-deck/${rootProject.moddeck_version}-mc${rootProject.minecraft_version}.jar")
def downloadModDeck = tasks.register("downloadModDeck") {
    inputs.property("modDeckVersion", rootProject.moddeck_version)
    inputs.property("minecraftVersion", rootProject.minecraft_version)
    inputs.property("modDeckUrl", rootProject.moddeck_file_url)
    inputs.property("modDeckSha1", rootProject.moddeck_sha1)
    outputs.file(modDeckJar)

    doLast {
        def expectedSha1 = rootProject.moddeck_sha1
        def sha1 = { File input ->
            def digest = java.security.MessageDigest.getInstance("SHA-1")
            digest.digest(java.nio.file.Files.readAllBytes(input.toPath()))
                .collect { String.format("%02x", it & 0xff) }
                .join()
        }

        if (modDeckJar.isFile() && sha1(modDeckJar) == expectedSha1) {
            return
        }

        if (modDeckJar.exists()) {
            delete(modDeckJar)
        }
        modDeckJar.parentFile.mkdirs()
        new URL(rootProject.moddeck_file_url).openStream().withCloseable { input ->
            java.nio.file.Files.copy(input, modDeckJar.toPath())
        }

        def actualSha1 = sha1(modDeckJar)
        if (actualSha1 != expectedSha1) {
            delete(modDeckJar)
            throw new GradleException("Downloaded ModDeck checksum mismatch: expected " + expectedSha1 + ", got " + actualSha1)
        }
    }
}
rootProject.ext.set("moddeck_jar", modDeckJar)
rootProject.ext.set("download_moddeck_task", downloadModDeck)

allprojects {
    group = rootProject.maven_group
    version = rootProject.ext.mod_version
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    loom {
        runs {
            client {
                programArgs '--username', 'ChatglotDev'
            }
        }
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.shedaniel.me/" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        dependsOn rootProject.ext.download_moddeck_task
        it.options.encoding = 'UTF-8'
        it.options.release = rootProject.java_version as Integer
    }

    processResources {
        def props = new LinkedHashMap(providers.gradlePropertiesPrefixedBy('').get())
        props.put("mod_version", rootProject.version.toString())
        inputs.properties(props)
        filesMatching(['*.mixins.json', '*.mod.json', 'META-INF/*mods.toml']) {
            expand(props)
        }
    }
}
