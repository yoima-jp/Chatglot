dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // ModDeck reuses version 0.1.0 for Minecraft 26.2 and 26.3. Use the
    // checksum-pinned 26.3 artifact selected by the root download task.
    implementation files(rootProject.moddeck_jar)
    // Lingua is embedded as a nested jar; its Kotlin/Moshi dependencies therefore
    // must be embedded explicitly as well instead of relying on Gradle's runtime
    // classpath, which is not present when Fabric loads the released mod jar.
    implementation(include("com.github.pemistahl:lingua:1.2.2"))
    implementation(include("org.jetbrains.kotlin:kotlin-stdlib:1.6.21"))
    implementation(include("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.0"))
    implementation(include("org.jetbrains.kotlin:kotlin-reflect:1.6.0"))
    implementation(include("com.squareup.moshi:moshi:1.13.0"))
    implementation(include("com.squareup.moshi:moshi-kotlin:1.13.0"))
    implementation(include("com.squareup.okio:okio:2.10.0"))
    compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    implementation(project(':common')) { transitive = false }

}

loom {
    mods {
        chatglot {
            sourceSet project(':common').sourceSets.main
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${rootProject.mod_id}-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

jar {
    from(project(':common').sourceSets.main.output)
}

sourcesJar {
    from(project(':common').sourceSets.main.allSource)
}
